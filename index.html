<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Penyusun RPS K-ARS25</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: alat kerja dua kolom — navigasi komponen RPS A–O di kiri, lembar isian di kanan; identitas mengikuti dek sosialisasi prodi (navy, teal, oker). */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#15222E; --muted:#56636E; --line:#D3DAD9;
  --navy:#16283A; --navy-ink:#F2F5F4; --accent:#2F6F73; --accent-soft:#DCEBEA; --accent-ink:#FFFFFF;
  --ochre:#A85A22; --ochre-soft:#F6E6D8; --ok:#2C7A4B; --ok-soft:#DDEFE3; --bad:#B3261E; --bad-soft:#F7DEDB;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#15212A; --sunk:#111B22; --ink:#E2E8EB; --muted:#93A1AA; --line:#293843;
  --navy:#0A1117; --navy-ink:#E2E8EB; --accent:#62A8AC; --accent-soft:#1D3537; --accent-ink:#0E161C;
  --ochre:#E39A62; --ochre-soft:#3A2818; --ok:#6CC08D; --ok-soft:#173023; --bad:#F08A80; --bad-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#15212A; --sunk:#111B22; --ink:#E2E8EB; --muted:#93A1AA; --line:#293843;
  --navy:#0A1117; --navy-ink:#E2E8EB; --accent:#62A8AC; --accent-soft:#1D3537; --accent-ink:#0E161C;
  --ochre:#E39A62; --ochre-soft:#3A2818; --ok:#6CC08D; --ok-soft:#173023; --bad:#F08A80; --bad-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.top .in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:4px 8px;flex:none}
.logos img{height:42px;width:auto;display:block}
@media (max-width:600px){.logos img{height:30px}.logos{padding:3px 5px;gap:4px}}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-head);font-size:1.15rem;font-weight:600}
.brand span{font-size:.78rem;opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.brand .dev{font-size:.72rem;opacity:.7;margin-top:2px;line-height:1.3}
.top button{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--navy-ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.08)}
.save{font-size:.82rem;opacity:.85}

/* generic controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{border-color:var(--ochre);color:var(--ochre)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;color:var(--ink);font-size:.95rem}
textarea{min-height:64px;resize:vertical;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.8rem;background:var(--surface);cursor:pointer;user-select:none;white-space:nowrap}
.chip input{margin:0}
.chip:has(input:disabled):not(.on){opacity:.45}
.checks .ic.info{color:var(--muted)}
.chip.nu{border-color:var(--accent,#b45309);font-weight:600}
.nchips{position:relative}
.ntip{position:relative}
.ntip:hover::after,.ntip:focus-within::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:min(420px,80vw);white-space:pre-line;background:#1f2937;color:#f9fafb;font-weight:400;font-size:.8rem;line-height:1.4;padding:8px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.ntipline{font-size:.82rem;min-height:1.2em;white-space:pre-line}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.76rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.st-draf{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.st-diajukan{background:var(--accent-soft);color:var(--accent)}
.st-revisi{background:var(--ochre-soft);color:var(--ochre)}
.st-disahkan{background:var(--ok-soft);color:var(--ok)}
.st-none{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-size:.9rem}
.note.warn{border-color:var(--ochre);background:var(--ochre-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{background:var(--sunk);font-weight:600;font-size:.8rem;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* home */
.home{padding-block:22px 48px;display:flex;flex-direction:column;gap:22px;max-width:1240px;margin:0 auto}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:1.9rem}
.hero p{max-width:62ch;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;min-width:110px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;font-family:var(--f-head)}
.stat span{font-size:.78rem;color:var(--muted)}
.smt{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.smt section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.smt header{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.smt header b{font-family:var(--f-head);font-size:1.02rem}
.mk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.mk:last-child{border-bottom:0}
.mk:hover{background:var(--sunk)}
.mk .kode{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.mk .nm{font-size:.9rem;min-width:0}
.mk .meta{grid-column:2/4;font-size:.76rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label.f{min-width:150px}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* editor */
.ed{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1380px;margin:0 auto;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:16px 10px 40px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.side .mkname{padding:0 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .mkname b{font-family:var(--f-head);font-size:1.05rem;display:block;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;text-align:left;background:transparent;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.nav button:hover{background:var(--surface)}
.nav button.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.part{background:linear-gradient(90deg,var(--ochre) 50%,transparent 50%);border-color:var(--ochre)}
.dot.na{border-style:dashed;opacity:.5}
.main{padding:20px 0 60px 26px;min-width:0;display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sechead .eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sechead p{color:var(--muted);max-width:75ch;font-size:.92rem}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.item .ih{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item .ih .code{font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.item .ih .sp{margin-left:auto;display:flex;gap:6px}
.sub{margin-left:18px;border-left:2px solid var(--accent-soft);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.preview{font-size:.92rem;background:var(--sunk);border-radius:6px;padding:8px 10px}
.preview b{color:var(--accent)}
.flag{font-size:.82rem;color:var(--ochre)}
.flag.bad{color:var(--bad)}
.weeks{display:flex;flex-direction:column;gap:8px}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wk .wn{font-family:var(--f-head);font-size:1.4rem;line-height:1;color:var(--accent)}
.wk .wn small{display:block;font-family:var(--f-ui);font-size:.7rem;color:var(--muted);margin-top:4px}
.wk.fixed{background:var(--sunk)}
.total{font-variant-numeric:tabular-nums;font-weight:600}
.total.ok{color:var(--ok)} .total.bad{color:var(--bad)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.checks{list-style:none;margin:0;padding:0}
.checks .ic{font-weight:700}
.ic.ok{color:var(--ok)} .ic.bad{color:var(--bad)} .ic.warn{color:var(--ochre)}
.inspire{display:flex;flex-direction:column;gap:12px}
.entri select{width:auto}
.ffs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ff{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--sunk);min-width:0;display:flex;flex-direction:column;gap:4px}
.ff .fl{font-size:.78rem;font-weight:600;color:var(--muted)}
.ff pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-ui);font-size:.85rem;margin:0;max-height:180px;overflow:auto}
details.ent{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
details.ent summary{cursor:pointer}
details.ent[open] summary{margin-bottom:8px}
.inspire pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.8rem;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0;max-height:260px;overflow:auto}
.banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);z-index:4}
.modal{position:fixed;inset:0;background:rgba(10,17,23,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border-radius:10px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:30}
.ro-note{font-size:.85rem}
.rek{border-color:var(--accent);background:var(--accent-soft)}
.pg h2{font-size:1.25rem}
.pg ol,.pg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pg{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 90px)}
.lvl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvl label.f span{font-weight:600}
@media (max-width:860px){
  .ed{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px 0}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .nav button{white-space:nowrap}
  .main{padding:16px 0 60px}
  .lvl{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .sub{margin-left:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 "CPL-01":"Mewujudkan sikap religius dan berjiwa Pancasila; Berperan sebagai warga negara yang berjiwa nasionalisme; Memiliki ketrampilan umum dalam berkomunikasi; Memiliki semangat kewirausahaan; Peka dan peduli terhadap nilai-nilai lokal dan global; serta Memegang teguh filosofi Si Tou Timou Tomou Tou.",

 "CPL-04":"Merancang suatu objek arsitektur berdasarkan konteks permasalahan tertentu, sebagai sebuah proses yang komprehensif, dengan hasil yang sesuai kriteria mutu prinsip-prinsip dasar arsitektur dan standar presentasi dokumen yang tepat dan komunikatif, khususnya kawasan pesisir dan perbukitan.",
 "CPL-05":"Mempelajari prinsip-prinsip dasar arsitektur terkait pengelolaan proses konstruksi dan pengawasan fisik bangunan gedung serta lingkungannya.",

 "CPL-07":"Memahami filsafat, kebudayaan dan seni, serta sejarah dan preseden global dan nusantara, dalam kaitannya dengan arsitektur; serta Menghargai nilai Arsitektur Vernakular sebagai dasar pengembangan ilmu, teknologi, dan seni, khususnya terkait kawasan pesisir dan perbukitan.",

 "CPL-10":"Menerapkan teori arsitektur dalam mendukung perumusan dan proposisi desain; serta Memahami metode penelitian serta aplikasinya, sebagai dasar pengembangan pengetahuan, keterampilan, dan proses desain arsitektural.",
 "CPL-11":"Menguasai manajemen proyek dan penerapannya, prinsip penyusunan dokumen konstruksi (DED, RKS, RAB); serta Mengenali sistem model informasi bangunan gedung, kode etik dan kaidah tata laku keprofesian, regulasi terkait bangunan gedung, sebagai dasar praktik arsitektur profesional.",

function cplOf(m){return Object.keys(m.cpl)}

function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks[ks.length-1]]=v}

function normalize(r){
 const m=MKBY[r.kode];
 r.a=r.a||{};["pengampu","prasyarat","deskripsi","koordinator","korprodi","ketuaKdk","tanggal"].forEach(k=>{if(r.a[k]==null)r.a[k]=""});if(!r.a.koord)r.a.koord=KOORD[r.kode]||"";
 {const cs=m?cplOf(m):[];(r.cpmk||[]).forEach(c=>{if(cs.length===1&&c.cpl&&!cs.includes(c.cpl))c.cpl=cs[0]})}
 (r.cpmk||[]).forEach(c=>{if(c.jenjang==null){const v=VERB_J[(c.verb||"").toLowerCase()];c.jenjang=v&&v.j?v.j:""}delete c.level});
 if(!r.entri||!r.entri.length)r.entri=m?defaultEntri(m):["Kuliah"];
 (r.minggu||[]).forEach(w=>{w.media=w.media==null?["Modul/Bahan Ajar"]:asArr(w.media);w.online=asArr(w.online).map(x=>ONLINE_OLD[x]||x);if(w.metode&&!METODE.includes(w.metode)&&w.metode in I2M)w.metode=I2M[w.metode]||""});
 (r.sub||[]).forEach(x=>{x.norma=[...new Set((x.norma||[]).map(k=>NORMA_OLD[k]||k).filter(k=>NORMA[k]))]});
 r.pengalaman=(r.pengalaman||[]).map(x=>({kegiatan:x.kegiatan||"",dikerjakan:x.dikerjakan||"",luaran:x.luaran||"",bentuk:x.bentuk==="Praktik Studio"?"Praktik":(x.bentuk||""),jenjang:x.jenjang||"",sub:x.sub||[],nonsub:!!x.nonsub}));
 (r.rubrik||[]).forEach(x=>{if(x.logika==null)x.logika="";if(x.asm==null)x.asm="";if(x.bobot==null)x.bobot="";
  if(x.la==null){x.la=x.l4||"";x.lb=x.l3||"";x.lc=x.l3||"";x.ld=x.l2||"";x.le=x.l1||"";if(x.gen&&x.gen.l4!=null)x.gen={la:x.gen.l4,lb:x.gen.l3,lc:x.gen.l3,ld:x.gen.l2,le:x.gen.l1};delete x.l4;delete x.l3;delete x.l2;delete x.l1}});
 if(r.rekap&&r.rekap.rows)Object.values(r.rekap.rows).forEach(x=>{if(x&&x.la==null&&(x.l4!=null||x.l3!=null||x.l2!=null||x.l1!=null)){x.la=x.l4||"";x.lb=x.l3||"";x.lc="";x.ld=x.l2||"";x.le=x.l1||"";delete x.l4;delete x.l3;delete x.l2;delete x.l1}});
 (r.nilai||[]).forEach(n=>{if(!n.id)n.id=uid()});
 (r.tugas||[]).forEach(t=>{if(t.asm==null)t.asm="";if(t.waktu==null)t.waktu=""});
 (r.sub||[]).forEach(s=>{if(s.moda==null)s.moda=""});
 r.a.mediaSw=r.a.mediaSw||"";r.a.mediaHw=r.a.mediaHw||"";r.a.team=r.a.team||"";
 r.bk=(r.bk||[]).map(x=>({pokok:x.pokok||"",uraian:x.uraian||"",sub:x.sub||[],nonsub:!!x.nonsub}));
 (r.sub||[]).forEach(x=>{if(x.jenjang==null){const v=VERB_J[(x.verb||"").toLowerCase()];x.jenjang=v&&v.j?v.j:""}});
 (r.nilai||[]).forEach(n=>{if(n.minggu==null)n.minggu="";if(n.luaran==null)n.luaran="";if(n.portal==null)n.portal=""});
 if(r.bobotV!==2){(r.sub||[]).forEach(s=>{const rows=(r.nilai||[]).filter(n=>n.sub===s.id);const S=rows.reduce((a,n)=>a+num(n.bobot),0);if(s.bobot==null||s.bobot==="")s.bobot=S?String(Math.round(S*100)/100):"";rows.forEach(n=>{n.bobot=S?String(Math.round(num(n.bobot)/S*10000)/100):""})});r.bobotV=2}
 (r.sub||[]).forEach(s=>{if(s.bobot==null)s.bobot=""});
 (r.tugas||[]).forEach(t=>{if(t.minggu==null)t.minggu=""});
 (r.metode||[]).forEach(x=>{x.bentuk=x.bentuk||"";if(x.bentuk==="Studio"||x.bentuk==="Praktik Studio")x.bentuk="Praktik";if(x.bentuk==="Presentasi")x.bentuk="Seminar";if(x.metode&&!METODE.includes(x.metode)&&x.metode in I2M)x.metode=(x.strategi&&METODE.includes(x.strategi))?x.strategi:(I2M[x.metode]||"");if(!x.metode&&x.strategi&&METODE.includes(x.strategi))x.metode=x.strategi;delete x.strategi});
 r.entri=r.entri.map(b=>b==="Praktik Studio"?"Praktik":b).map(b=>BENTUK.includes(b)?b:(b==="Presentasi"?"Seminar":"Kuliah"));
 return r;

function subText(r,s,cd){const n=(s.norma||[]).join(", ");return `Mahasiswa mampu ${s.verb||""} ${s.teks||""}`.replace(/\s+/g," ").trim()+` (${cd.c[s.cpmk]||"CPMK"}${s.jenjang?" · "+s.jenjang:""}${n?"; "+n:""})`}
const PRAK=b=>!["Kuliah","Responsi","Tutorial"].includes(b);
function entries(r){
 const m=MKBY[r.kode],cd=codes(r),E=(r.entri&&r.entri.length)?r.entri:["Kuliah"];
 const subById=Object.fromEntries(r.sub.map(s=>[s.id,s]));
 const isP=b=>PRAK(b)&&m.pr>0;const nK=E.filter(b=>!isP(b)).length,nP=E.length-nK;
 const kS=m.pr>0?m.t:m.sks;const out=[];
 r.minggu.forEach((w,wi)=>{const mg=wi+1;
  const rows=r.nilai.filter(n=>+n.minggu===mg);
  E.forEach((b,i)=>{
   const prak=isP(b);
   const tm=prak?(nP?Math.round(m.pr*170/nP):0):(nK?Math.round(kS*45/nK):0);
   const pt=prak?0:(nK?Math.round(kS*60/nK):0),bm=prak?0:(nK?Math.round(kS*65/nK):0);
   const last=i===E.length-1;
   const e={no:wi*E.length+i+1,mg,prak,bentuk:b,bentukIns:insBentuk(b),metodeIns:insMetode(w.metode),sub:w.sub.map(id=>subById[id]).filter(Boolean).map(s=>subText(r,s,cd)),bk:w.bk,metode:w.metode,media:asArr(w.media).join(", "),online:asArr(w.online).join(", "),tm,pt,bm,
    tugas:i===0?r.tugas.filter(t=>+t.minggu===mg).map(t=>t.judul).filter(Boolean):[],pengalaman:i===0?w.pengalaman:"",bobot:0,kriteria:"",bentukN:"",luaran:"",indikator:""};
   if(last&&rows.length){
    e.bobot=rows.reduce((a,n)=>a+nEff(r,n),0);
    e.kriteria=rows.map(n=>{const rb=r.rubrik.filter(x=>x.sub===n.sub).map(x=>x.kriteria).filter(Boolean);return `${cd.s[n.sub]||""}: ${rb.length?rb.join("; "):(n.instrumen||"")}`}).join(" | ");
    e.bentukN=rows.map(n=>[n.teknik,n.jenis].filter(Boolean).join(", ")).join(" | ");
    e.luaran=rows.map(n=>n.luaran).filter(Boolean).join(" | ");
    e.indikator=rows.map(n=>subById[n.sub]?.indikator||"").filter(Boolean).join(" | ");
   }
   out.push(e)});
 });
 return out;
}
function firstWord(t){return (t||"").trim().split(/\s+/)[0]?.toLowerCase()||""}
function nonOp(verb,teks){const w=[verb,firstWord(teks)].map(x=>(x||"").toLowerCase());return NONOP.find(n=>w.includes(n))}
/* Model bobot dua tingkat (sesuai Portal INSPIRE):
   1) bobot Sub-CPMK terhadap MK (sub.bobot; total semua Sub-CPMK = 100%)
   2) bobot setiap komponen penilaian di dalam Sub-CPMK (nilai.bobot; total per Sub-CPMK = 100%)
   Bobot efektif komponen terhadap MK = bobot Sub-CPMK × bobot komponen / 100. */
function nInt(r,n){if(String(n.bobot??"").trim()!=="")return num(n.bobot);return r.nilai.filter(x=>x.sub===n.sub).length===1?100:0}
function nEff(r,n){const s=r.sub.find(x=>x.id===n.sub);return s?num(s.bobot)*nInt(r,n)/100:0}
function subInt(r,id){return r.nilai.filter(n=>n.sub===id).reduce((a,n)=>a+nInt(r,n),0)}
function bobot(r){
 const per={cpmk:{},cpl:{},sub:{},int:{}};let tot=0,subTot=0;
 const cpById=Object.fromEntries(r.cpmk.map(c=>[c.id,c]));
 r.sub.forEach(s=>{subTot+=num(s.bobot);per.int[s.id]=subInt(r,s.id)});
 r.nilai.forEach(n=>{const b=nEff(r,n);tot+=b;const s=r.sub.find(x=>x.id===n.sub);if(!s)return;per.sub[s.id]=(per.sub[s.id]||0)+b;const c=cpById[s.cpmk];if(!c)return;per.cpmk[c.id]=(per.cpmk[c.id]||0)+b;per.cpl[c.cpl]=(per.cpl[c.cpl]||0)+b});
 return {...per,tot,subTot};
}
function menit(m){return {tm:m.t*45,pt:m.t*60,bm:m.t*65,pr:(m.pr+m.pk)*170}}

function checks(r){
 const m=MKBY[r.kode], out=[], cd=codes(r), b=bobot(r);
 const add=(ok,txt,sec,warn)=>out.push({ok,txt,sec,warn:!ok&&!!warn,info:warn==="info"});
 add(!!(r.a.koord&&r.a.pengampu.trim()&&r.a.deskripsi.trim()),"Identitas: koordinator MK, dosen pengampu, dan deskripsi MK terisi","A");
 add(!!r.a.prasyarat.trim(),"MK prasyarat diisi (tulis “tidak ada” bila tidak ada)","A");
 cplOf(m).forEach(c=>add(r.cpmk.some(x=>x.cpl===c&&x.teks.trim()),`${c} yang dibebankan memiliki minimal satu CPMK`,"C"));
 r.cpmk.forEach(x=>{const k=cd.c[x.id];
  add(!!(x.verb&&x.teks.trim()),`${k}: kata kerja dan rumusan terisi`,"C");
  if(x.cpl&&!cplOf(m).includes(x.cpl))add(false,`${k}: ${x.cpl} tidak dibebankan pada MK ini menurut Buku Kurikulum; pilih ${cplOf(m).join(" atau ")}`,"C");
  const no=nonOp(x.verb,x.teks); if(no) add(false,`${k}: kata “${no}” tidak operasional; ganti dengan kata kerja yang dapat diamati`,"C");
  add(!!x.jenjang,`${k}: jenjang Bloom ditetapkan (level LAMDEPILAR mengikuti jenjang)`,"C");
  const vi=verbInfo(x.verb); if(vi&&vi.j&&x.jenjang&&vi.j!==x.jenjang) add(false,`${k}: kata “${x.verb}” lazim pada ${vi.g}, sedangkan jenjang ditetapkan ${x.jenjang}; boleh, asalkan tugas memang menuntut ${x.jenjang}`,"C","info");
  add(r.sub.some(s=>s.cpmk===x.id),`${k} dijabarkan ke minimal satu Sub-CPMK`,"C");
 });
 r.sub.forEach(s=>{const k=cd.s[s.id];
  add(!!(s.teks.trim()&&s.indikator.trim()),`${k}: rumusan dan indikator terisi`,"C");
  add(!!b.sub[s.id],`${k} dinilai pada matriks penilaian (I.1)`,"I");
 });
 if(r.nilai.length){const ps=portalSum(r);const used=PORTAL.filter(p=>ps[p[0]].b>0);add(used.length>1||r.nilai.some(n=>n.jenis==="Formatif"),"Saran: penilaian tidak hanya bertumpu pada satu komponen portal; pertimbangkan komponen formatif (mis. aktivitas partisipatif, asistensi, kuis)","I","info");}
 r.nilai.forEach((n,i)=>add(+n.minggu>=1&&+n.minggu<=16,`Penilaian baris ${i+1}: minggu pelaksanaan ditetapkan (dipakai untuk bobot per pertemuan INSPIRE)`,"I"));
 r.cpmk.forEach(x=>{const k=cd.c[x.id];const subs=r.sub.filter(s=>s.cpmk===x.id);if(!subs.length)return;
  add(subs.every(s=>s.jenjang),`${k}: setiap Sub-CPMK memiliki jenjang Bloom`,"C",true);
  const cj=JORD[x.jenjang];const sj=subs.map(s=>JORD[s.jenjang]).filter(Boolean);
  if(cj&&sj.length){add(Math.max(...sj)===cj,`${k}: Sub-CPMK berjenjang hingga mencapai jenjang CPMK (${x.jenjang})`,"C",true);
   if(Math.max(...sj)>cj)add(false,`${k}: ada Sub-CPMK di atas jenjang CPMK; Sub-CPMK adalah uraian, bukan kemampuan yang lebih tinggi`,"C")}});
 {const rk=rek(m);if(r.cpmk.some(x=>x.jenjang))add(r.cpmk.some(x=>x.jenjang===rk.target||(x.alasanJ||"").trim()),`Saran: ${KAT[rk.kat].label} lazimnya memiliki CPMK pada ${rk.target}. Jenjang lain boleh bila sesuai tuntutan tugas; tulis alasannya di catatan jenjang CPMK`,"C","info")}
 {const tot={};r.rubrik.forEach(x=>{const a=rubAsm(r,x);if(a)tot[a]=(tot[a]||0)+num(x.bobot)});const bc=buktiCodes(r);Object.entries(tot).forEach(([a,t])=>add(Math.abs(t-100)<0.01,`Rubrik ${bc[a]||""}: jumlah bobot kriteria = 100% (saat ini ${fmt(t)}%)`,"N"));}
 add(r.sub.some(s=>(s.norma||[]).length),"Minimal satu Sub-CPMK dianotasi norma LAMDEPILAR (NB/NK)","C",true);
 add(r.sub.every(s=>(s.norma||[]).length<=2),"Setiap Sub-CPMK memuat paling banyak 2 norma","C");
 add(r.bk.length>0&&r.bk.every(x=>x.pokok.trim()&&(x.sub.length||x.nonsub)),"Pokok bahasan (materi pembelajaran) terisi dan terkait Sub-CPMK (kecuali yang ditandai umum)","D");
 add(!r.sub.length||!r.bk.length||r.sub.every(s=>r.bk.some(x=>x.sub.includes(s.id))),"Setiap Sub-CPMK dilayani minimal satu pokok bahasan","D",true);
 add(r.metode.length>0,"Bentuk dan metode pembelajaran dipilih","E");
 if(m.studio){add(r.metode.some(x=>x.bentuk==="Praktik"),"MK studio: bentuk “Praktik” dicantumkan (LAMDEPILAR mensyaratkan pembelajaran berbasis studio)","E");
  add(r.entri.includes("Praktik"),"MK studio: entri INSPIRE per minggu memuat “Praktik”","G")}
 add(r.pengalaman.length>0,"Pengalaman belajar mahasiswa diuraikan","F");
 if(r.pengalaman.length){add(r.pengalaman.every(x=>x.kegiatan.trim()&&x.dikerjakan.trim()&&x.luaran.trim()),"Setiap pengalaman belajar memuat kegiatan, uraian kerja mahasiswa, dan luaran","F");
  add(r.pengalaman.every(x=>(x.sub||[]).length||x.nonsub),"Setiap pengalaman belajar ditautkan ke Sub-CPMK (kecuali yang ditandai umum)","F",true);
  r.sub.forEach(s=>{const k=cd.s[s.id];if(!s.jenjang)return;const px=r.pengalaman.filter(x=>(x.sub||[]).includes(s.id));if(px.length)add(px.some(x=>!JORD[x.jenjang]||!JORD[s.jenjang]||JORD[x.jenjang]>=JORD[s.jenjang]),`${k} (${s.jenjang}) dilatih oleh pengalaman belajar setara jenjangnya`,"F",true)});
  const bE=new Set([...r.entri,...r.metode.map(x=>x.bentuk)].filter(Boolean));add(r.pengalaman.every(x=>!x.bentuk||bE.has(x.bentuk)),"Bentuk pada pengalaman belajar tercantum di bagian E atau bentuk per minggu","F",true);}
 const filled=r.minggu.filter(w=>w.bk.trim()||w.sub.length).length;
 add(filled>=14,`Rencana mingguan terisi (${filled}/16 minggu)`,"G");
 add(r.tugas.length>0&&r.tugas.every(t=>t.judul.trim()&&t.kriteria.trim()),"Rencana tugas lengkap dengan kriteria penilaian","H");
 add(Math.abs(b.subTot-100)<0.01,`Total bobot Sub-CPMK terhadap MK = 100% (saat ini ${fmt(b.subTot)}%)`,"I");
 r.sub.filter(s=>r.nilai.some(n=>n.sub===s.id)).forEach(s=>add(Math.abs(b.int[s.id]-100)<0.01,`${cd.s[s.id]}: jumlah bobot komponen penilaian di dalam Sub-CPMK = 100% (saat ini ${fmt(b.int[s.id])}%)`,"I"));
 add(Math.abs(b.tot-100)<0.01,`Total bobot efektif penilaian = 100% (saat ini ${fmt(b.tot)}%)`,"I");
 if(r.nilai.length){const pr=portalRules(r);add(pr.ok50,`Aturan portal: bobot Aktivitas Partisipatif + Hasil Proyek minimal 50% dari total (saat ini ${fmt(pr.pct)}%)`,"I");
  add(!pr.dup.length,"Aturan portal: UTS dan UAS masing-masing paling banyak satu kali dalam satu Sub-CPMK","I");
  ["uts","uas"].forEach(k=>{if(pr.wk[k].length)add(!pr.once.includes(k),`Aturan portal: ${k.toUpperCase()} dilaksanakan satu kali; semua komponen ${k.toUpperCase()} berada pada minggu yang sama (saat ini: ${pr.wk[k].map(w=>w||"belum ditetapkan").join(", ")})`,"I")});}
 const needR=r.nilai.filter(n=>/rubrik/i.test(n.instrumen)).map(n=>n.sub);
 [...new Set(needR)].forEach(id=>add(r.rubrik.some(x=>x.sub===id&&x.la.trim()&&x.le.trim()),`${cd.s[id]||"Sub-CPMK"}: rubrik empat level tersedia (N)`,"N"));
 const p=porsi(m);
 cplOf(m).forEach(c=>{if(p[c]==null||!b.tot)return;const got=(b.cpl[c]||0)/b.tot*100;add(Math.abs(got-p[c])<=15,`${c}: proporsi bobot ${fmt(got)}% dekat porsi kurikulum ${fmt(p[c])}% (selisih ≤ 15 poin)`,"L",true)});
 add(r.ref.utama.filter(x=>x.trim()).length>0,"Minimal satu referensi utama","J");
 const badApa=[...r.ref.utama,...r.ref.pendukung].filter(x=>x.trim()&&!/\(\d{4}[a-z]?\)|\(n\.d\.\)|\(t\.t\.\)/.test(x));
 add(badApa.length===0,badApa.length?`${badApa.length} referensi belum memuat tahun dalam format APA, mis. “(2020)”`:"Referensi memakai pola APA (tahun dalam kurung)","J",true);
 return out;
}
function secState(r,key){
 if(!r)return"";
 const m=MKBY[r.kode];
 switch(key){
  case"A":return r.a.koord&&r.a.pengampu&&r.a.deskripsi.trim()&&r.a.prasyarat.trim()?"ok":(r.a.pengampu||r.a.deskripsi||r.a.prasyarat?"part":"");
  case"B":case"K":return"ok";
  case"C":{if(!r.cpmk.some(x=>x.teks.trim()))return"";const ok=r.cpmk.every(x=>x.teks.trim()&&x.verb&&x.jenjang&&!nonOp(x.verb,x.teks)&&r.sub.some(s=>s.cpmk===x.id))&&r.sub.every(s=>s.teks.trim()&&s.indikator.trim())&&cplOf(m).every(c=>r.cpmk.some(x=>x.cpl===c));return ok?"ok":"part"}
  case"D":return !r.bk.length?"":(r.bk.every(x=>x.pokok.trim())?"ok":"part");
  case"E":return r.metode.length?"ok":"";
  case"F":return r.pengalaman.length?"ok":"";
  case"G":{const f=r.minggu.filter(w=>w.bk.trim()||w.sub.length).length;return f>=14?"ok":f>3?"part":""}
  case"H":return !r.tugas.length?"":(r.tugas.every(t=>t.judul.trim()&&t.kriteria.trim())?"ok":"part");
  case"I":{const b=bobot(r);return !r.nilai.length?"":(Math.abs(b.tot-100)<0.01&&Math.abs(b.subTot-100)<0.01&&r.sub.every(s=>b.sub[s.id])&&r.nilai.every(n=>+n.minggu>=1)?"ok":"part")}
  case"J":return r.ref.utama.some(x=>x.trim())?"ok":"";
  case"L":{const b=bobot(r);return b.tot?"ok":""}
  case"M":return Object.values(r.asesmen).every(v=>String(v).trim())?"ok":"part";
  case"N":return !r.rubrik.length?"":(r.rubrik.every(x=>LK.every(k=>(x[k]||"").trim()))?"ok":"part");
  case"O":return Object.keys(r.rekap.rows||{}).length?"part":"na";
  case"cek":{const c=checks(r).filter(x=>!x.info);return c.every(x=>x.ok)?"ok":"part"}
 }
 return"";
}
function progress(r){const c=checks(r).filter(x=>!x.info);return c.length?Math.round(c.filter(x=>x.ok).length/c.length*100):0}

const LS_KEY="rpsK25.docs.v1";
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
function lsRead(){try{return JSON.parse(lsGet(LS_KEY)||"{}")||{}}catch(e){return {}}}
function makeLocalDb(){
 const subs=new Set(),dsubs={};
 const snapDoc=(id,d)=>({id,exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
 const emit=()=>{const all=lsRead();const docs=Object.entries(all).map(([k,v])=>snapDoc(k,v));subs.forEach(f=>f({docs,size:docs.length,empty:!docs.length}));Object.keys(dsubs).forEach(id=>dsubs[id].forEach(f=>f(snapDoc(id,all[id]))))};
 try{window.addEventListener("storage",e=>{if(e.key===LS_KEY)emit()})}catch(e){}
 return {collection(){return{
  onSnapshot(next){subs.add(next);setTimeout(emit,0);return()=>subs.delete(next)},
  doc(id){return{
   async get(){return snapDoc(id,lsRead()[id])},
   async set(d){const all=lsRead();all[id]=clone(d);if(!lsSet(LS_KEY,JSON.stringify(all)))throw{code:"quota_exceeded"};emit()},
   async delete(){const all=lsRead();delete all[id];lsSet(LS_KEY,JSON.stringify(all));emit()},
   onSnapshot(next){(dsubs[id]=dsubs[id]||[]).push(next);return()=>{dsubs[id]=(dsubs[id]||[]).filter(f=>f!==next)}}
  }}
 }}};
}
function listen(db){
 const t=setTimeout(()=>{if(!S.listLoaded){S.listSlow=true;render()}},10000);
 db.collection("rps").onSnapshot(snap=>{
  clearTimeout(t);S.listLoaded=true;S.listSlow=false;
  S.list=snap.docs.map(d=>({id:d.id,...d.data()}));
  resolveNames();
  if(S.view==="home")render();
 },err=>{clearTimeout(t);S.listLoaded=true;S.listErr=err.code;render()});
}

const gs=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({code:"unavailable",message:String(e&&e.message||e)}))[fn](...a));
function makeSheetsDb(){
 const subs=new Set(),dsubs={};
 const snapDoc=(id,d)=>({id,exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
 const vis=()=>{try{return document.visibilityState!=="hidden"}catch(e){return true}};
 async function refresh(){if(!subs.size)return;try{const rows=await gs("listDocs");const docs=rows.map(r=>snapDoc(r.id,r));subs.forEach(f=>f({docs,size:docs.length,empty:!docs.length}))}catch(e){toast("Gagal memuat daftar RPS dari Google Sheet")}}
 setInterval(()=>{if(vis())refresh()},30000);
 setInterval(async()=>{if(!vis())return;for(const id of Object.keys(dsubs)){if(!dsubs[id].length)continue;try{const d=await gs("getDoc",id);dsubs[id].forEach(f=>f(snapDoc(id,d)))}catch(e){}}},20000);
 return {collection(){return{
  onSnapshot(next){subs.add(next);refresh();return()=>subs.delete(next)},
  doc(id){return{
   async get(){return snapDoc(id,await gs("getDoc",id))},
   async set(d){const r=await gs("saveDoc",id,JSON.stringify(d),S.korPin||"");if(r&&r.conflict)throw{code:"conflict",data:r.data};if(r&&r.error)throw{code:r.error,message:r.message||""};refresh()},
   async delete(){const r=await gs("deleteDoc",id,S.korPin||"");if(r&&r.error)throw{code:r.error,message:r.message||""};refresh()},
   onSnapshot(next){(dsubs[id]=dsubs[id]||[]).push(next);return()=>{dsubs[id]=(dsubs[id]||[]).filter(f=>f!==next)}}
  }}
 }}};
}

async function openRps(id){
 if(S.unsubDoc){S.unsubDoc();S.unsubDoc=null}
 let data=null;
 if(S.db){const s=await docRef(id).get();data=s.exists?s.data():null}else data=memStore[id]?clone(memStore[id]):null;
 if(!data){toast("RPS tidak ditemukan");return}
 S.cur=normalize({id,...clone(data)});S.baseVersion=data.version||0;S.dirty=false;S.conflict=null;S.view="editor";S.sec="status";S.vman={};
 if(S.db){
  S.unsubDoc=docRef(id).onSnapshot(snap=>{
   if(!snap.exists||!S.cur||S.cur.id!==id)return;const d=snap.data();
   if((d.version||0)<=S.baseVersion)return;
   if(d.sid===SID){S.baseVersion=d.version;return}
   if(S.dirty){S.conflict=d;render()}else{S.cur=normalize({id,...clone(d)});S.baseVersion=d.version||0;render();toast("RPS diperbarui oleh pengguna lain")}
  },()=>{});
 }
 render();window.scrollTo(0,0);
}
let saveTimer=null;
function touch(){if(!editable())return;S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1800);paintSave()}
async function saveNow(){
 clearTimeout(saveTimer);
 if(!S.cur||!S.dirty||S.conflict)return;
 if(S.saving){S.pend=true;return}
 S.saving=true;paintSave();
 const {id,...body}=S.cur;body.version=(S.baseVersion||0)+1;body.updatedBy=S.me.id||"";body.updatedByName=S.me.name||"";body.updatedAt=Date.now();body.sid=SID;try{body.progress=progress(normalize(clone({...body})))}catch(e){}
 try{
  if(S.db)await docRef(id).set(clone(body));else memStore[id]=clone(body);
  S.baseVersion=body.version;S.cur.version=body.version;S.cur.updatedAt=body.updatedAt;S.cur.updatedBy=body.updatedBy;S.dirty=false;S.lastSaved=Date.now();S.saveErr=null;
 }catch(e){if(e&&e.code==="conflict"){S.conflict=e.data;S.saveErr=null;render()}else if(e&&e.code==="forbidden"){S.saving=false;S.dirty=false;toast(e.message||"Tindakan ini hanya untuk Korprodi");openRps(S.cur.id);return}else{S.saveErr=e&&e.code;if(e&&e.message)toast(e.message);if(e&&e.code==="invalid_argument"){S.canWrite=false;render()}}}
 S.saving=false;
 if(S.pend){S.pend=false;if(S.dirty)saveNow()}
 paintSave();
}
function paintSave(){const el=$("#savest");if(!el)return;el.textContent=saveText()}
function saveText(){
 if(S.preview)return"Mode pratinjau: tidak tersimpan";
 if(!editable())return"Hanya baca";
 if(S.saveErr)return"Gagal menyimpan — periksa koneksi";
 if(S.saving)return"Menyimpan…";
 if(S.dirty)return"Perubahan belum tersimpan";
 if(S.lastSaved)return"Tersimpan "+new Date(S.lastSaved).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
 return"Tersimpan";
}
function editable(){const r=S.cur;if(!r)return false;if(!S.canWrite)return false;if(r.status==="disahkan")return false;return true}
async function createRps(kode,ta,smt,copyFrom){
 const m=MKBY[kode];const id=docId(kode,ta,smt);
 const exists=S.db?(await docRef(id).get()).exists:!!memStore[id];
 if(exists){S.modal=null;openRps(id);toast("RPS untuk MK dan semester ini sudah ada; dibuka.");return}
 let body=newRps(m,ta,smt);
 if(copyFrom){
  let src=null;if(S.db){const s=await docRef(copyFrom).get();src=s.exists?s.data():null}else src=memStore[copyFrom];
  if(src){body={...normalize(clone({...src})),ta,smt,status:"draf",telaah:[],rekap:{rows:{},analisis:{terlemah:"",penyebab:"",perbaikan:"",temuan:""},arsip:{}},version:0,createdBy:S.me.id||"",createdAt:Date.now()}}
 }
 body.updatedBy=S.me.id||"";body.updatedByName=S.me.name||"";body.createdByName=S.me.name||"";body.updatedAt=Date.now();body.version=1;body.sid=SID;try{body.progress=progress(normalize(clone({...body})))}catch(e){}
 try{if(S.db)await docRef(id).set(body);else memStore[id]=clone(body);if(!S.db)S.list=Object.entries(memStore).map(([i,d])=>({id:i,...d}))}
 catch(e){toast(e&&e.code==="quota_exceeded"?"Kapasitas basis data penuh; hubungi Korprodi.":"Tidak dapat membuat RPS: akses tulis tidak tersedia.");return}
 S.modal=null;openRps(id);
}

  <li>${mode==="claude"?"Buka aplikasi dari tautan claude.ai yang dibagikan Korprodi (akses Contributor).":mode==="sheets"?"Buka tautan aplikasi web dari prodi dengan akun Google Anda.":"Buka berkas <b>Penyusun-RPS-K-ARS25.html</b> dengan peramban (Chrome, Edge, Firefox, atau Safari)."}</li>
  ${mode!=="claude"?"<li>Saat pertama kali, isi <b>nama dan gelar</b>. Nama ini tercatat pada RPS dan catatan telaah. Klik nama di kop untuk mengubahnya.</li>":""}
  <li>Di halaman depan, klik nama MK (atau <b>+ Susun RPS baru</b>), isi tahun akademik dan semester, lalu klik <b>Buat RPS</b>.</li>
  <li>Identitas MK, sks, CPL yang dibebankan, porsi kontribusi, dan koordinator MK terisi otomatis dari Buku Kurikulum dan distribusi KDK. Bagian ini tidak diubah di RPS.</li>
  <li>Bila RPS MK yang sama sudah ada, Anda dapat membukanya atau membuat RPS semester baru dengan <b>menyalin isinya</b>.</li></ol>`)}
 ${sec("p-alur","Alur penyusunan",`<p>Menu kiri mengikuti Templat RPS A–O. Titik di samping setiap bagian menunjukkan kelengkapan: <span class="dot ok" style="display:inline-block"></span> lengkap, <span class="dot part" style="display:inline-block"></span> sebagian, <span class="dot" style="display:inline-block"></span> belum diisi. Isian tersimpan otomatis.</p>
  <div class="tblw"><table><thead><tr><th>Urutan yang disarankan</th><th>Yang dikerjakan</th></tr></thead><tbody>
  <tr><td>1. A Identitas</td><td>Dosen pengampu, MK prasyarat (tulis “tidak ada” bila tidak ada), deskripsi MK.</td></tr>
  <tr><td>2. C CPMK dan Sub-CPMK</td><td>Rumuskan CPMK untuk setiap CPL, lalu uraikan menjadi Sub-CPMK. Kata kerja dipilih dari daftar atau ditulis manual. Lihat bagian berikut.</td></tr>
  <tr><td>3. D Pokok bahasan</td><td>Tulis pokok bahasan (materi pembelajaran) dari CPMK/Sub-CPMK; uraian materi bersifat opsional. Tombol <b>+ Orientasi RPS</b>, <b>+ UTS</b>, dan <b>+ UAS</b> menambah pokok bahasan umum yang ditandai <i>tidak melayani Sub-CPMK tertentu</i>.</td></tr>
  <tr><td>4. E Bentuk dan metode</td><td>Pilih bentuk dan metode (istilah OBE) atau pilih <b>✎ Tulis manual…</b> bila tidak ada di daftar. Padanan INSPIRE tampil otomatis; metode manual menjadi “Metode Pembelajaran Lain”.</td></tr>
  <tr><td>5. F Pengalaman belajar</td><td>Gunakan <b>pilihan cepat</b> yang disesuaikan dengan kelompok MK dan jenjang Sub-CPMK (butir ✓), lalu sunting atau tulis sendiri. Kegiatan umum (mis. orientasi) dapat ditandai <i>tidak melayani Sub-CPMK tertentu</i>. F berisi jenis kegiatan (lazimnya 4–10), bukan 16 baris jadwal.</td></tr>
  <tr><td>6. I Sistem penilaian</td><td>Dua tingkat bobot seperti di Portal INSPIRE: bobot setiap Sub-CPMK terhadap MK (total 100%), lalu satu atau beberapa komponen penilaian di dalam setiap Sub-CPMK (total 100% per Sub-CPMK), lengkap dengan jenis formatif/sumatif dan komponen portal.</td></tr>
  <tr><td>7. G Rencana 16 minggu</td><td>Bentuk per minggu, lalu <b>Isi otomatis</b>. Media dan On-line/E-learning dipilih dengan kotak centang sesuai pilihan Portal INSPIRE (boleh lebih dari satu). setiap minggu diisi Sub-CPMK, pokok bahasan (D), metode (E), dan kegiatan F yang tertaut. Minggu 8 dan 16 dicadangkan untuk evaluasi; sunting bila juri studio jatuh di minggu 16.</td></tr>
  <tr><td>8. H, J</td><td>Rencana tugas dan referensi (APA edisi 7).</td></tr>
  <tr><td>9. M, N</td><td>Rencana asesmen (sudah terisi awal) dan rubrik lima tingkat (A–E) per asesmen dengan bobot kriteria dan logika deskriptor (lihat bagian berikut). Di bagian H, buat Format Rancangan Tugas untuk setiap asesmen B-xx.</td></tr>
  <tr><td>10. Pemeriksaan OBE</td><td>Bereskan semua tanda ✕, lalu ajukan di bagian Status.</td></tr>
  <tr><td>11. O Rekap capaian CPL</td><td>Diisi di akhir semester, juga setelah RPS disahkan.</td></tr></tbody></table></div>`)}
 ${sec("p-cpmk","CPMK, jenjang, dan Design Spine",`<ul>
  <li>Baca kartu <b>★ Rekomendasi</b> di bagian C: jenjang CPMK, urutan jenjang Sub-CPMK, kata kerja, norma utama MK, dan alasannya. Rekomendasi bersifat <b>saran, tidak wajib</b>. Bila jenjang Anda berbeda, isi <b>Catatan jenjang (opsional)</b> untuk penelaah. Klik <b>Terapkan rekomendasi</b> untuk mengisi jenjang yang masih kosong.</li>
  <li><b>MK inti studio</b> (DDA 1–2, DA 1–4, Pra TA, TA) dan <b>MK khas</b> pesisir–perbukitan berada pada C6 sejak semester awal. Pembedanya adalah skala objek, tipologi, tapak, integrasi sistem, dan cara berproses, sebagaimana ditampilkan pada <b>Profil Design Spine</b>. Gunakan aspek profil itu sebagai dasar Sub-CPMK dan kriteria rubrik.</li>
  <li>Rumus CPMK: <i>Mahasiswa mampu</i> + kata kerja + objek + konteks + kriteria. Pilih kata kerja dari daftar (kelompok ★ paling atas) atau pilih <b>✎ Tulis manual…</b> bila kata yang tepat tidak tersedia; untuk kata manual, tetapkan jenjang sendiri. Hindari kata yang tidak teramati seperti <i>memahami, mengetahui, menguasai</i>.</li>
  <li>Tetapkan <b>jenjang Bloom</b> dari tuntutan tugas, bukan dari kata kerja semata. Level LAMDEPILAR mengikuti otomatis: C1–C2 Pemahaman; C3–C6, P, dan A Kemampuan.</li>
  <li>Sub-CPMK tidak melampaui jenjang CPMK induknya, dan minimal satu Sub-CPMK mencapai jenjang CPMK (mis. C4 → C5 → C6).</li>
  <li>Sediakan minimal satu CPMK untuk setiap CPL yang dibebankan, agar capaian tiap CPL dapat dilaporkan terpisah. Beri <b>paling banyak dua</b> kode norma pada Sub-CPMK yang relevan: NB1–NB2 (Norma Bersama) dan NK1–NK12 (Norma Bidang Keilmuan Arsitektur). Sorot kode untuk melihat rumusannya; tanda ★ menunjukkan norma utama MK menurut matriks MK–norma dan hanya bersifat saran.</li></ul>`)}
 ${sec("p-nilai","Penilaian dan rencana mingguan",`<ul>
  <li>Di bagian I, isi dulu <b>bobot setiap Sub-CPMK terhadap MK</b> (total 100%; tombol <b>Bagi rata bobot Sub-CPMK</b> membaginya sama besar). Lalu tambahkan <b>komponen penilaian</b> di dalam setiap Sub-CPMK. Bila satu Sub-CPMK dinilai lebih dari sekali (mis. Aktivitas Partisipatif 50% dan UTS 50%), jumlah bobot komponennya harus 100% untuk Sub-CPMK itu. Satu komponen saja otomatis dianggap 100%.</li>
  <li>Bobot efektif setiap komponen terhadap nilai MK = bobot Sub-CPMK × bobot komponen. Contoh: Sub-CPMK-1 berbobot 25% dinilai Portofolio 50% dan Aktivitas Partisipatif 50%, sehingga masing-masing menyumbang 12,5% nilai MK.</li>
  <li>Setiap komponen diberi <b>jenis</b> (formatif/sumatif) dan <b>komponen portal INSPIRE</b> (disarankan otomatis dari teknik dan minggu). Aplikasi menampilkan dua tabel seperti di portal: <b>Daftar Assessment</b> per Sub-CPMK dan <b>Rencana Evaluasi</b> yang menjumlahkan bobot efektif per komponen.</li>
  <li><b>Simulasi nilai</b> (opsional) di bagian I: isi contoh skor per asesmen untuk melihat nilai akhir dan huruf menurut Pasal 59 serta ketercapaian setiap CPMK. Data simulasi tidak disimpan.</li>
  <li>Aturan portal diperiksa otomatis: bobot <b>Aktivitas Partisipatif + Hasil Proyek minimal 50%</b> dari total, dan <b>UTS/UAS</b> masing-masing dilaksanakan satu kali dalam satu RPS: satu UTS boleh menguji beberapa Sub-CPMK, tetapi minggunya sama. Mengubah minggu satu komponen UTS/UAS otomatis menyamakan minggu komponen UTS/UAS lainnya.</li>
  <li>Isi <b>minggu pelaksanaan</b> setiap penilaian. Aplikasi menempatkan bobot pada pertemuan minggu itu; pertemuan lain otomatis 0%.</li>
  <li>Di bagian G, tetapkan <b>bentuk per minggu</b> sesuai entri kelas di INSPIRE (mis. Kuliah + Praktik). Menit tatap muka, penugasan, dan mandiri dihitung otomatis: kuliah 45′/60′/65′ per sks; praktikum dan studio 170′ per sks.</li>
  <li><b>Isi otomatis</b> memakai kolom “minggu ke-” pada Sub-CPMK serta isian bagian D, E, dan F, dan hanya mengisi kolom yang masih kosong.</li>
  <li>Rubrik (bagian N, Skema Penilaian Kompetensi) memakai lima tingkat sesuai format Fakultas: <b>A</b> Sangat Memuaskan 85–100 · <b>B</b> Memuaskan 70–84,99 · <b>C</b> Batas 60,01–69,99 · <b>D</b> Kurang Memuaskan 45–60 · <b>E</b> Di Bawah Standar &lt; 45. Tingkat C adalah batas minimum ketuntasan setiap kriteria. Huruf A–E adalah tingkat kinerja per kriteria, bukan nilai huruf MK.</li>
  <li><b>Ambang Ketercapaian CPMK: 60,01</b> (mahasiswa tuntas bila skor ≥ 60,01) dan <b>Target Ketercapaian Kelas: 85%</b> (pembelajaran berhasil bila ≥ 85% mahasiswa mencapai ambang). Keduanya tidak mengubah ketentuan nilai huruf dan kelulusan MK menurut Pasal 59.</li>
  <li>Setiap kriteria rubrik terikat pada satu asesmen (kode bukti <b>B-xx</b> dari bagian I) dan diberi bobot; jumlah bobot kriteria dalam satu asesmen = 100%.</li>
  <li>Setiap kriteria memakai satu <b>logika deskriptor</b> yang disarankan otomatis: <b>SOLO</b> untuk analisis dan karya rancangan, <b>Dreyfus</b> untuk proses studio (asistensi, logbook), <b>Dave</b> untuk keterampilan (jenjang P), <b>Krathwohl</b> untuk sikap (jenjang A), dan <b>Standar mutu kriteria</b> untuk produk teknis. Kelima tingkat terisi otomatis dari kriteria dan indikator Sub-CPMK (untuk SOLO, tingkat C = relasional pada unsur utama); tingkat yang sudah Anda sunting tidak ditimpa. Hasilnya draf: sunting agar spesifik pada tugas.</li>
  <li>Acuan logika yang dipakai otomatis ditambahkan ke <b>bagian K Dasar acuan</b> dan berkas Word.</li></ul>`)}
 ${sec("p-periksa","Pemeriksaan dan pengajuan",`<ul>
  <li><b>Pemeriksaan OBE</b> menampilkan tanda ✕ (wajib dibereskan), ⚠ (peringatan yang perlu dipertimbangkan), dan ℹ (saran; tidak memengaruhi persentase lolos periksa). Klik tautan di setiap butir untuk menuju bagiannya.</li>
  <li>Setelah semua butir wajib terpenuhi, buka <b>Status dan telaah</b>, lalu klik <b>Ajukan untuk telaah</b>. Catatan telaah dari Korprodi tampil di bagian yang sama.</li>

 ${sec("p-inspire","Word dan Portal INSPIRE",`<ol>
  <li>Buka bagian <b>Ekspor Word dan INSPIRE</b>. Klik <b>Unduh .docx</b> untuk RPS format Fakultas Teknik UNSRAT (lanskap: ringkasan MK, rencana per Sub-CPMK, rencana 16 minggu, serta Format Rancangan Tugas dan Skema Penilaian per asesmen B-xx) beserta Lampiran Kelengkapan OBE–LAMDEPILAR (komponen A–O), dengan kop Universitas Sam Ratulangi – Fakultas Teknik – Jurusan Arsitektur – PS S1 Arsitektur beserta logo di setiap halaman; simpan di arsip prodi untuk keperluan mutu dan akreditasi.</li>
  <li>Buka Portal INSPIRE di tab lain. Salin <b>Bagian umum</b> dan <b>Rencana Evaluasi</b> kolom demi kolom dengan tombol <b>Salin</b>; nama kolom sama dengan di portal.</li>
  <li>Untuk pertemuan (“Minggu Ke-” di INSPIRE), pilih <b>Tampilkan entri: Minggu 1</b>, salin setiap kolom, lalu lanjut ke minggu berikutnya. Kolom yang masih kosong diberi tanda.</li>
  <li>CPMK dan Sub-CPMK di INSPIRE membawa penanda seperti “(CPL-04) [Kemampuan · C6]” agar keterlacakan OBE tetap terbaca di portal.</li></ol>
  <p class="muted" style="font-size:.88rem">Level LAMDEPILAR, norma NB/NK, bobot CPMK–CPL, rencana asesmen, rubrik, dan rekap capaian tidak punya kolom di INSPIRE; komponen ini hanya ada di berkas Word.</p>`)}
 ${sec("p-korprodi","Untuk Korprodi",`<ul>
  <li>${mode==="sheets"?"Klik <b>Masuk sebagai Korprodi</b> di halaman depan dan masukkan PIN dari lembar Pengaturan, atau masuk otomatis bila surel Anda tercatat di sana.":mode==="lokal"?"Centang <b>Mode Korprodi</b> di halaman depan. Masukkan berkas data dari dosen melalui <b>Buka berkas data (.json)</b>; beberapa berkas dapat dipilih sekaligus.":"Sebagai pemilik atau Editor aplikasi, Anda otomatis memiliki peran Korprodi."}</li>

  <li>Halaman <b>Data kurikulum</b> memuat CPL, MK, koordinator, dan butir data kurikulum yang telah diverifikasi.</li></ul>`)}
 ${sec("p-data","Penyimpanan dan cadangan data",(mode==="sheets"?`<p>Isian tersimpan otomatis ke Google Sheet prodi. Daftar RPS diperbarui setiap 30 detik. Bila dua orang menyunting RPS yang sama, aplikasi memberi peringatan dan meminta Anda memilih versi yang dipakai.</p>`:mode==="lokal"?`<p>Isian tersimpan di penyimpanan peramban (localStorage) pada perangkat ini, sekitar 5 MB atau cukup untuk puluhan sampai ratusan RPS, dan tidak terkirim ke mana pun.</p>
  <div class="note warn"><b>Isian dapat hilang atau tidak terbaca bila:</b><ul style="margin:6px 0 0 18px"><li>riwayat, cookie, atau data situs peramban dibersihkan;</li><li>berkas dibuka di peramban lain, komputer lain, atau jendela penyamaran/<i>incognito</i>;</li><li>berkas aplikasi diganti nama atau dipindah folder (terutama di Firefox dan Safari);</li><li>peramban atau sistem operasi dipasang ulang.</li></ul></div>`:`<p>Isian tersimpan otomatis ke basis data bersama aplikasi di claude.ai dan dapat dilihat Korprodi. Bila dua orang menyunting RPS yang sama, aplikasi memberi peringatan dan meminta Anda memilih versi yang dipakai. Gunakan versi ini untuk uji coba; arsip resmi tetap disimpan prodi.</p>`)+
  `<h3 style="margin-top:8px">Kebiasaan cadangan yang disarankan</h3><ol>
  <li>Tekan <b>Cadangkan semua (.json)</b> di halaman depan ${mode==="lokal"?"<b>setiap selesai bekerja</b>":"secara berkala, misalnya setiap minggu selama masa penyusunan"}. Simpan berkasnya di folder yang ikut tercadangkan (mis. Google Drive atau OneDrive institusi).</li>

const SECTIONS=[["status","Status dan telaah"],["A","A. Identitas MK"],["B","B. CPL dibebankan"],["C","C. CPMK dan Sub-CPMK"],["D","D. Pokok bahasan"],["E","E. Bentuk dan metode"],["F","F. Pengalaman belajar"],["G","G. Rencana 16 minggu"],["H","H. Rencana tugas"],["I","I. Sistem penilaian"],["J","J. Referensi"],["K","K. Dasar acuan"],["L","L. Bobot CPMK–CPL"],["M","M. Rencana asesmen"],["N","N. Rubrik"],["O","O. Rekap capaian CPL"],["cek","Pemeriksaan OBE"],["ekspor","Ekspor Word dan INSPIRE"]];
function editorView(){
 const r=S.cur;if(!r)return"";const m=MKBY[r.kode];
 return `<div class="wrap"><div class="ed">
  <aside class="side">
   <div class="mkname"><span class="mono muted">${m.kode} · ${esc(r.smt)} ${esc(r.ta)}</span><b>${esc(m.nama)}</b>
    <div class="row" style="margin-top:6px"><span class="pill st-${r.status}">${STATUS[r.status]}</span><span class="muted" style="font-size:.8rem">${progress(r)}% lolos periksa</span></div></div>
   <nav class="nav" aria-label="Komponen RPS">${SECTIONS.map(([k,l])=>`<button data-act="sec" data-sec="${k}" class="${S.sec===k?"cur":""}" ${S.sec===k?'aria-current="true"':""}><span class="dot ${secState(r,k)}"></span>${l}</button>`).join("")}</nav>
  </aside>
  <main class="main">
   ${S.conflict?`<div class="banner note bad"><b>RPS ini baru saja diubah oleh ${esc(who(S.conflict.updatedBy))}.</b> Perubahan Anda belum tersimpan. <div class="row" style="margin-top:6px"><button class="btn sm" data-act="takeremote">Pakai versi terbaru (buang perubahan saya)</button><button class="btn sm warn" data-act="keepmine">Simpan versi saya di atasnya</button></div></div>`:""}
   ${!editable()&&!S.conflict?`<div class="note ${r.status==="disahkan"?"":"warn"} ro-note">${r.status==="disahkan"?"RPS ini sudah disahkan dan dikunci. Korprodi dapat membukanya kembali bila perlu direvisi.":"Anda hanya dapat membaca RPS ini."}</div>`:""}
   ${section(S.sec)}
  </main>
 </div></div>`;
}
function head(eb,title,desc){return `<div class="sechead"><span class="eyebrow">${eb}</span><h2>${title}</h2>${desc?`<p>${desc}</p>`:""}</div>`}
const D=()=>editable()?"":"disabled";
function inp(p,v,ph,type){return `<input type="${type||"text"}" id="f-${p}" data-p="${p}" value="${esc(v)}" ${ph?`placeholder="${esc(ph)}"`:""} ${D()}>`}
function ta(p,v,ph,rows){return `<textarea id="f-${p}" data-p="${p}" rows="${rows||3}" ${ph?`placeholder="${esc(ph)}"`:""} ${D()}>${esc(v)}</textarea>`}
function sel(p,v,opts,blank){return `<select id="f-${p}" data-p="${p}" ${D()}>${blank!==false?`<option value="">${blank||"— pilih —"}</option>`:""}${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`}).join("")}</select>`}
function chips(p,arr,opts){arr=arr||[];return `<div class="chips">${opts.map(([val,lab,title])=>`<label class="chip ${arr.includes(val)?"on":""}" ${title?`title="${esc(title)}"`:""}><input type="checkbox" id="f-${p}-${val}" data-arr="${p}" value="${esc(val)}" ${arr.includes(val)?"checked":""} ${D()}>${esc(lab)}</label>`).join("")}</div>`}
function subOpts(r){const cd=codes(r);return subList(r).map(s=>[s.id,cd.s[s.id],s.teks])}
function addBtn(act,label,extra){return editable()?`<button class="btn sm" data-act="${act}" ${extra||""}>+ ${label}</button>`:""}
function delBtn(list,i){return editable()?`<button class="btn sm danger" data-act="del" data-list="${list}" data-i="${i}" aria-label="Hapus">Hapus</button>`:""}
function selMan(p,v,opts,ph){
 v=v||"";const vals=opts.map(o=>Array.isArray(o)?o[0]:o);const man=!!(S.vman&&S.vman[p])||(!!v&&!vals.includes(v));

  case"addpb":mutate(r=>pbAdd(r,PB[+el.dataset.i]));break;
  case"addpbok":mutate(r=>{const m=MKBY[r.kode],js=rpsJenjang(r,m);PB.filter(it=>it.g===el.dataset.g&&js.has(it.j)).forEach(it=>pbAdd(r,it))});break;
  case"applyrek":mutate(r=>{const rk=rek(MKBY[r.kode]);r.cpmk.forEach(c=>{if(!c.jenjang)c.jenjang=rk.target;const subs=subList(r).filter(s=>s.cpmk===c.id);subs.forEach((s,i)=>{if(!s.jenjang){const L={...rk,ladder:rk.ladder.filter(j=>!JORD[j]||!JORD[c.jenjang]||JORD[j]<=JORD[c.jenjang])}; s.jenjang=jLadder(L.ladder.length?L:rk,i,subs.length)}})});toast("Rekomendasi jenjang diterapkan pada isian yang kosong")});break;
  case"del":{const L=el.dataset.list,i=+el.dataset.i;S.vman={};const label={cpmk:"CPMK beserta Sub-CPMK-nya",sub:"Sub-CPMK ini",nilai:"baris penilaian ini",rubrik:"kriteria rubrik ini",tugas:"tugas ini",bk:"pokok bahasan ini",metode:"baris ini",pengalaman:"kegiatan ini"}[L];
   const ok=await confirmAsk("Hapus?",`Hapus ${label}? Tindakan ini tidak dapat dibatalkan.`,"Hapus",true);if(!ok)break;
   mutate(r=>{const it=r[L][i];r[L].splice(i,1);
    if(L==="cpmk"){const gone=r.sub.filter(s=>s.cpmk===it.id).map(s=>s.id);r.sub=r.sub.filter(s=>s.cpmk!==it.id);scrub(r,gone)}
    if(L==="sub")scrub(r,[it.id]);});break}
  case"addref":mutate(r=>r.ref[el.dataset.g].push(""));break;
  case"delref":mutate(r=>{r.ref[el.dataset.g].splice(+el.dataset.i,1);if(!r.ref[el.dataset.g].length)r.ref[el.dataset.g].push("")});break;
  case"autoweeks":mutate(autoWeeks);toast("Rencana mingguan diisi dari Sub-CPMK, D, E, dan F");break;
  case"addnilaisub":mutate(r=>{const id=el.dataset.sub;let at=-1;r.nilai.forEach((n,i)=>{if(n.sub===id)at=i});const x={sub:id,teknik:"",instrumen:"",jenis:"",penilai:"Dosen pengampu",bobot:"",minggu:"",luaran:"",portal:""};if(at<0)r.nilai.push(x);else r.nilai.splice(at+1,0,x)});break;
  case"ratasub":mutate(r=>{const n=r.sub.length;if(!n)return;const v=Math.floor(10000/n)/100;r.sub.forEach((s,i)=>s.bobot=String(i===n-1?Math.round((100-v*(n-1))*100)/100:v))});toast("Bobot Sub-CPMK dibagi rata");break;
  case"dupnilai":mutate(r=>{const i=+el.dataset.i,x=r.nilai[i];r.nilai.splice(i+1,0,{sub:x.sub,teknik:"",instrumen:"",jenis:"",penilai:x.penilai||"Dosen pengampu",bobot:"",minggu:"",luaran:"",portal:""})});break;
  case"autonilai":mutate(r=>{const has=new Set(r.nilai.map(n=>n.sub));subList(r).forEach(s=>{if(!has.has(s.id)){const mm=String(s.minggu||"").match(/(\d+)\s*(?:[-–]\s*(\d+))?/);const end=mm?Math.min(16,+(mm[2]||mm[1])):"";r.nilai.push({sub:s.id,teknik:"",instrumen:"Rubrik analitik",jenis:"Sumatif",penilai:"Dosen pengampu",bobot:"",minggu:end?String(end):"",luaran:"",portal:""})}})});break;
  case"addentri":mutate(r=>r.entri.push(MKBY[r.kode].studio?"Praktik":"Kuliah"));break;
  case"delentri":mutate(r=>{if(r.entri.length>1)r.entri.splice(+el.dataset.i,1)});break;
  case"copyf":copyText(S.copyBuf[+el.dataset.i]||"");break;
  case"autorubrik":mutate(r=>{const has=new Set(r.rubrik.map(x=>rubAsm(r,x)));r.nilai.filter(n=>/rubrik/i.test(n.instrumen)||!n.instrumen).forEach(n=>{if(n.sub&&!has.has(n.id)){const s=r.sub.find(x=>x.id===n.sub);const x={sub:n.sub,asm:n.id,kriteria:s?(s.indikator||"").split(/[.;\n]/)[0].slice(0,80):"",bobot:"100",logika:"",la:"",lb:"",lc:"",ld:"",le:""};rubApply(r,x);r.rubrik.push(x)}})});break;
  case"status":{const to=el.dataset.to;
   const msg={diajukan:["Ajukan untuk telaah?","RPS akan ditelaah Korprodi. Anda masih dapat mengubahnya sampai disahkan.","Ajukan"],revisi:["Kembalikan untuk revisi?","Catatan di kolom telaah akan disimpan bersama keputusan ini.","Minta revisi"],disahkan:["Sahkan RPS ini?","RPS akan dikunci dari perubahan. Rekap capaian (O) tetap dapat diisi.","Sahkan"]}[to];
   if(!await confirmAsk(...msg))break;
   if(to!=="diajukan")await addTelaah(to);
   S.cur.status=to;S.dirty=true;await saveNow();render();toast(STATUS[to]);break}
  case"note":if(await addTelaah("")){S.dirty=true;await saveNow();render();toast("Catatan disimpan")}break;
  case"takeremote":S.cur=normalize({id:r.id,...clone(S.conflict)});S.baseVersion=S.conflict.version||0;S.conflict=null;S.dirty=false;render();break;
  case"keepmine":S.baseVersion=S.conflict.version||0;S.conflict=null;S.dirty=true;await saveNow();render();break;
  case"delrps":{if(!await confirmAsk("Hapus RPS?",`RPS ${r.kode} ${r.smt} ${r.ta} akan dihapus permanen dari basis data prodi.`,"Hapus permanen",true))break;
   try{if(S.db)await docRef(r.id).delete();else delete memStore[r.id];}catch(e){toast(e&&e.message?e.message:"Gagal menghapus");break}
   if(S.unsubDoc){S.unsubDoc();S.unsubDoc=null}S.cur=null;S.dirty=false;S.view="home";render();toast("RPS dihapus");break}
  case"docx":await downloadDocx();break;
  case"savejson":{await saveNow();const {id,...d}=S.cur;await saveFile(fileName(S.cur)+".json",jsonBlob({format:"rps-k-ars25",versi:1,id,data:d}));break}
  case"backup":{const docs={};S.list.forEach(({id,...d})=>docs[id]=d);await saveFile(`Cadangan_RPS_K-ARS25_${new Date().toISOString().slice(0,10)}.json`,jsonBlob({format:"rps-k-ars25",versi:1,docs}));break}
  case"nama":S.modal={type:"nama",nama:S.me.name};render();break;
  case"korpin":S.modal={type:"pin",pin:""};render();break;
  case"savepin":{const pin=(S.modal.pin||"").trim();try{const w=await gs("whoami",pin);if(w&&w.korprodi){S.korPin=pin;ssSet("rpsK25.pin",pin);S.isKorprodi=true;S.modal=null;render();toast("Masuk sebagai Korprodi")}else toast("PIN tidak cocok")}catch(e){toast("Tidak dapat menghubungi Google Sheet")}break}
  case"savenama":{const n=(S.modal.nama||"").trim();if(!n){toast("Isi nama terlebih dahulu");break}S.me.name=n;lsSet("rpsK25.nama",n);S.modal=null;render();break}

 }
}
function scrub(r,ids){const g=new Set(ids);const f=a=>(a||[]).filter(x=>!g.has(x));r.bk.forEach(x=>x.sub=f(x.sub));r.metode.forEach(x=>x.sub=f(x.sub));r.tugas.forEach(x=>x.sub=f(x.sub));r.pengalaman.forEach(x=>x.sub=f(x.sub));r.minggu.forEach(x=>x.sub=f(x.sub));r.nilai=r.nilai.filter(x=>!g.has(x.sub));r.rubrik=r.rubrik.filter(x=>!g.has(x.sub))}
function autoWeeks(r){
 const act={};const lab=x=>[x.kegiatan,x.luaran].filter(Boolean).join(" → ");
 subList(r).forEach(s=>{const mm=String(s.minggu||"").match(/(\d+)\s*(?:[-–]\s*(\d+))?/);if(!mm)return;let a=+mm[1],b=+(mm[2]||mm[1]);if(a>b)[a,b]=[b,a];a=Math.max(1,a);b=Math.min(16,b);
  const L=r.pengalaman.filter(x=>!x.nonsub&&x.kegiatan.trim()&&(x.sub||[]).includes(s.id)).sort((p,q)=>(JORD[p.jenjang]||(p.jenjang?6.5:7))-(JORD[q.jenjang]||(q.jenjang?6.5:7)));
  const span=[];for(let w=a;w<=b;w++)if(w!==1&&w!==8&&w!==16)span.push(w);
  span.forEach((w,k)=>{const W=r.minggu[w-1];if(!W.sub.includes(s.id))W.sub.push(s.id);
   if(L.length){const x=L[Math.min(L.length-1,Math.floor(k*L.length/span.length))];(act[w]=act[w]||[]).includes(x)||act[w].push(x)}});
 });
 r.minggu.forEach((W,i)=>{const w=i+1;
  if(w===1){const u=r.pengalaman.filter(x=>x.nonsub&&x.kegiatan.trim());if(u.length&&(!W.pengalaman.trim()||W.pengalaman==="Memahami kontrak kuliah dan kriteria penilaian"))W.pengalaman=u.map(lab).join("; ");return}
  if(w===8||w===16||!W.sub.length)return;
  if(!W.bk.trim()){const b=r.bk.filter(x=>!x.nonsub&&x.pokok.trim()&&x.sub.some(id=>W.sub.includes(id))).map(x=>x.pokok.trim());if(b.length)W.bk=b.slice(0,2).join("; ")}
  if(!W.metode){const mt=r.metode.find(x=>x.metode&&x.sub.some(id=>W.sub.includes(id)));if(mt)W.metode=mt.metode}
  if(!W.pengalaman.trim()&&act[w])W.pengalaman=act[w].map(lab).join("; ");
 });
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Disalin")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Disalin")}catch(_){toast("Pilih teks lalu salin manual")}ta.remove()}}
async function saveFile(name,blob){
 let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});toast("Berkas dikirim ke unduhan")}catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"Tunggu sebentar, lalu coba lagi":"Unduhan tidak tersedia di tampilan ini")}return}
 try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Berkas diunduh: "+name)}catch(e){toast("Unduhan gagal di peramban ini")}
}
async function downloadDocx(){await saveFile(fileName(S.cur)+".docx",buildDocx(S.cur))}
function jsonBlob(o){return new Blob([JSON.stringify(o,null,1)],{type:"application/json"})}
async function importFiles(files){
 let ok=0,skip=0,bad=0;
 for(const f of files){
  try{const o=JSON.parse(await f.text());
   const docs=o&&o.format==="rps-k-ars25"?(o.docs||(o.id?{[o.id]:o.data}:{})):null;
   if(!docs){bad++;continue}
   for(const [id,d] of Object.entries(docs)){
    if(!d||!MKBY[d.kode]||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)){bad++;continue}
    const ex=S.list.find(x=>x.id===id);
    if(ex&&(ex.updatedAt||0)>(d.updatedAt||0)){skip++;continue}
    const body=clone(d);body.version=Math.max(body.version||0,(ex&&ex.version)||0)+1;
    await S.db.collection("rps").doc(id).set(body);ok++;
   }
  }catch(e){bad++}
 }
 toast(`${ok} RPS dibuka${skip?`, ${skip} dilewati karena versi di perangkat ini lebih baru`:""}${bad?`, ${bad} berkas tidak dikenali`:""}`);
}
function refreshDerived(){
 const r=S.cur;if(!r)return;
 document.querySelectorAll(".nav button[data-sec]").forEach(b=>{const d=b.querySelector(".dot");if(d)d.className="dot "+secState(r,b.dataset.sec)});
 const t=document.getElementById("i-total");if(t){const b=bobot(r);const okk=v=>Math.abs(v-100)<0.01;t.textContent=fmt(b.tot)+"%";t.className="total "+(okk(b.tot)?"ok":"bad");
  const st=document.getElementById("i-subtot");if(st){st.textContent=fmt(b.subTot)+"%";st.className="total "+(okk(b.subTot)?"ok":"bad")}
  r.sub.forEach(s=>{const e=document.getElementById("isub-"+s.id);if(e){const v=b.int[s.id]||0;e.textContent=fmt(v)+"/100";e.className="total "+(r.nilai.some(n=>n.sub===s.id)&&okk(v)?"ok":"bad")}});
 {const e=document.getElementById("i-aphp");if(e)e.textContent=fmt(portalRules(r).pct)+"%"}
  r.nilai.forEach((n,i)=>{const e=document.getElementById("ieff-"+i);if(e)e.textContent="= "+fmt(nEff(r,n))+"% dari nilai MK"})}
 {const tot={};r.rubrik.forEach(x=>{const a=rubAsm(r,x);if(a)tot[a]=(tot[a]||0)+num(x.bobot)});r.nilai.forEach(n=>{const e=document.getElementById("ntot-"+n.id);if(e){const t=tot[n.id]||0;e.textContent=fmt(t)+"/100";e.className="total "+(Math.abs(t-100)<0.01?"ok":"bad")}})}
 const m=MKBY[r.kode];cplOf(m).forEach(c=>{const x=(r.rekap.rows||{})[c]||{};const n=num(x.n),a=num(x.la)+num(x.lb)+num(x.lc),tot=LK.reduce((q,k)=>q+num(x[k]),0);const pc=n?a/n*100:null;
  const e1=document.getElementById("rk-pc-"+c),e2=document.getElementById("rk-tg-"+c);
  if(e1)e1.innerHTML=(pc==null?"—":fmt(pc)+"%")+(n&&tot!==n?`<br><span class="flag">jumlah ≠ ${n}</span>`:"");
  if(e2)e2.innerHTML=pc==null?"—":pc>=TARGET?`<span class="pill st-disahkan">Terpenuhi</span>`:`<span class="pill st-revisi">Belum</span>`});
}

app.addEventListener("change",e=>{

 if(t.dataset.arr){if(!editable())return;const arr=(getPath(S.cur,t.dataset.arr)||[]).slice();const i=arr.indexOf(t.value);if(t.checked&&i<0){if(/\.norma$/.test(t.dataset.arr)&&arr.length>=2){t.checked=false;toast("Maksimal 2 norma per Sub-CPMK. Lepas salah satu dahulu.");return}arr.push(t.value)}if(!t.checked&&i>=0)arr.splice(i,1);setPath(S.cur,t.dataset.arr,arr);touch();render();return}
 if(t.dataset.bool){if(!S.canWrite)return;setPath(S.cur,t.dataset.bool,t.checked);S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1200);render();return}
 if(t.dataset.p){
  if(t.tagName==="SELECT"){if(!editable())return;let v=t.value;if(t.dataset.verbpick){S.vman=S.vman||{};if(v==="__manual"){S.vman[t.dataset.p]=true;const cur=getPath(S.cur,t.dataset.p)||"";if(cur&&[...t.options].some(o=>o.value===cur||o.text===cur))setPath(S.cur,t.dataset.p,"");touch();render();setTimeout(()=>{const el=document.getElementById("f-"+t.dataset.p);if(el)el.focus()},0);return}delete S.vman[t.dataset.p]}setPath(S.cur,t.dataset.p,v);
   if(/^cpmk\.\d+\.verb$/.test(t.dataset.p)){const vi=VERB_J[v];const i=+t.dataset.p.split(".")[1];if(vi&&vi.j&&!S.cur.cpmk[i].jenjang)S.cur.cpmk[i].jenjang=vi.j}
   if(/^sub\.\d+\.verb$/.test(t.dataset.p)){const vi=VERB_J[v];const i=+t.dataset.p.split(".")[1];if(vi&&vi.j&&!S.cur.sub[i].jenjang)S.cur.sub[i].jenjang=vi.j}
   {const mm=t.dataset.p.match(/^rubrik\.(\d+)\.(sub|logika)$/);if(mm)rubApply(S.cur,S.cur.rubrik[+mm[1]],false)}
   {const mm=t.dataset.p.match(/^nilai\.(\d+)\.portal$/);if(mm&&(v==="uts"||v==="uas")){const x=S.cur.nilai[+mm[1]];const other=S.cur.nilai.find(n=>n!==x&&portalOf(n)===v&&n.minggu);if(!x.minggu)x.minggu=other?other.minggu:(v==="uts"?"8":"16")}
    const mw=t.dataset.p.match(/^nilai\.(\d+)\.minggu$/);if(mw){const x=S.cur.nilai[+mw[1]];const k=portalOf(x);if(k==="uts"||k==="uas")S.cur.nilai.forEach(n=>{if(portalOf(n)===k)n.minggu=v});}}
   touch();render();return}
  {const mm=t.dataset.p.match(/^rubrik\.(\d+)\.kriteria$/);if(mm&&editable()){const i=+mm[1],x=S.cur.rubrik[i];if(x){const pl=document.getElementById("rlog-"+i);if(pl)pl.textContent=LOGIKA[logOf(S.cur,x)].n;const so=document.querySelector(`[id="f-rubrik.${i}.logika"] option[value=""]`);if(so){const sb=S.cur.sub.find(y=>y.id===x.sub);so.textContent="Otomatis (saran: "+LOGIKA[sugLogika(sb,x.kriteria)].n+")"}}if(x&&rubApply(S.cur,x,false)){LK.forEach(k=>{const el=document.getElementById(`f-rubrik.${i}.${k}`);if(el)el.value=x[k]});touch()}}}
  refreshDerived();
 }
